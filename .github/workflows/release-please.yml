name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Prefer a PAT (RELEASE_PLEASE_TOKEN) so commits made by this action
          # trigger downstream workflows like sync-marketplace.yml. Pushes made
          # with the default GITHUB_TOKEN do NOT fire other workflow events.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Auto-merge release PRs
      - name: Auto-merge release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          prs='${{ steps.release.outputs.prs }}'
          echo "PRs created: $prs"

          pr_numbers=$(echo "$prs" | jq -r '.[].number')
          while IFS= read -r pr_number; do
            if [ -z "$pr_number" ]; then
              continue
            fi
            echo "Enabling auto-merge for PR #$pr_number"
            if ! out=$(gh pr merge "$pr_number" --auto --squash --delete-branch --repo ${{ github.repository }} 2>&1); then
              if [[ "$out" == *"Auto merge is not allowed for this repository"* ]]; then
                echo "::warning::PR #$pr_number: $out"
                continue
              fi
              printf '%s\n' "$out"
              exit 1
            fi
            if [ -n "$out" ]; then
              printf '%s\n' "$out"
            fi
          done <<< "$pr_numbers"

      # Output release info for debugging
      - name: Release info
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          # Pass JSON via env var instead of inline interpolation. The JSON
          # contains characters like parens (from changelog URLs) that break
          # bash parsing when interpolated directly into a `run:` script.
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          echo "Releases created: ${{ steps.release.outputs.releases_created }}"
          echo "Release output: $RELEASE_OUTPUTS"
