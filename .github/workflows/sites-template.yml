name: Sites template
on:
  pull_request:
    paths: ["skills/sites/template/**", ".github/workflows/sites-template.yml"]
  push:
    branches: [main]
    paths: ["skills/sites/template/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/sites/template/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace
      - name: DESIGN.md lint
        run: pnpm design:lint
      - name: Tokens match DESIGN.md
        run: pnpm design:tokens && git diff --exit-code src/styles/theme.css
      - name: Type check and build
        run: pnpm build
      - name: Built-page audit
        run: pnpm audit:built
